version: 2.1
jobs:
  crdroid9-source:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    retention:
      caches: "1d"
    steps:
      - run:
          name: Fetch the exact public build-infra commit
          command: |
            git init .
            git remote add origin https://github.com/ReMeizu/build-infra.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - restore_cache:
          keys:
            - crdroid9-m6-v1-{{ checksum "inputs/crdroid9-m6.xml" }}-
      - run:
          name: Download crDroid Android 9 and M6 LOS16 sources
          no_output_timeout: 5m
          command: python3 scripts/crdroid9_sync.py
      - save_cache:
          key: crdroid9-m6-v1-{{ checksum "inputs/crdroid9-m6.xml" }}-{{ .BuildNum }}
          paths:
            - /home/circleci/crdroid9-m6
      - store_artifacts:
          path: evidence/crdroid9
      - run:
          name: Require complete source sync
          command: python3 -c 'import json; s=json.load(open("evidence/crdroid9/status.json")); assert s["sync_complete"], "Partial source cache saved; inspect sync.log before resuming"'
workflows:
  crdroid9-m6-sources:
    jobs:
      - approve-source-download:
          type: approval
      - crdroid9-source:
          requires:
            - approve-source-download
