version: 2.1
parameters:
  cloud_benchmark:
    type: boolean
    default: false
jobs:
  cloud-benchmark:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - checkout
      - run:
          name: Bounded CPU memory and ephemeral disk benchmark
          no_output_timeout: 10m
          command: |
            export BENCHMARK_ROOT="$PWD"
            timeout --signal=TERM --kill-after=10s 8m bash scripts/cloud_benchmark_job.sh
      - store_artifacts:
          path: evidence
          destination: benchmark
workflows:
  cloud-benchmark-only:
    when: << pipeline.parameters.cloud_benchmark >>
    jobs:
      - cloud-benchmark
