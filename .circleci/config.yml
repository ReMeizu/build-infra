version: 2.1
jobs:
  m6-cloud-capacity:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - run:
          name: Fetch exact public capacity controller
          command: |
            git init .
            git remote add origin https://github.com/ReMeizu/build-infra.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Inspect cloud CPU memory and disk descriptors
          command: /usr/bin/python3 scripts/m6_cloud_capacity.py
      - store_artifacts:
          path: evidence/m6-cloud-capacity
  m6-cloud-public-source:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    retention:
      caches: "1d"
    steps:
      - run:
          name: Fetch exact public orchestration commit
          command: |
            date +%s > /home/circleci/m6-source-ci-start
            git init .
            git remote add origin https://github.com/ReMeizu/build-infra.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - restore_cache:
          keys:
            - m6-public-pinned-v2-{{ checksum "inputs/crdroid9-m6-resolved.xml" }}-
      - run:
          name: Install public source transport
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y git-lfs
      - run:
          name: Verify preparation guards
          command: /usr/bin/python3 -m unittest discover -s tests -p test_m6_cloud_source.py
      - run:
          name: Fresh sync of 701 exact public revisions and public LFS
          no_output_timeout: 5m
          command: /usr/bin/python3 scripts/m6_cloud_source.py
      - save_cache:
          key: m6-public-pinned-v2-{{ checksum "inputs/crdroid9-m6-resolved.xml" }}-{{ .BuildNum }}
          paths:
            - /home/circleci/m6-public-pinned
      - store_artifacts:
          path: evidence/m6-cloud-source
      - run:
          name: Require complete pinned source and verified LFS
          command: /usr/bin/python3 -c 'import json; s=json.load(open("evidence/m6-cloud-source/status.json")); assert s["sync_complete"] and s["public_revisions_verified"] == 701 and s["lfs_payloads_verified"], "Partial public downloads retained; source not admitted"'
workflows:
  m6-cloud-source-preparation:
    jobs:
      - approve-cloud-inventory:
          type: approval
          filters:
            branches:
              only: m6-circle-cloud-only
      - m6-cloud-capacity:
          requires:
            - approve-cloud-inventory
          filters:
            branches:
              only: m6-circle-cloud-only
      - approve-public-source:
          type: approval
          requires:
            - m6-cloud-capacity
          filters:
            branches:
              only: m6-circle-cloud-only
      - m6-cloud-public-source:
          requires:
            - approve-public-source
          filters:
            branches:
              only: m6-circle-cloud-only
