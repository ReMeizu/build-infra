version: 2.1
jobs:
  cloud-benchmark:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - run:
          name: Fetch exact public benchmark commit over HTTPS
          command: |
            set -eu
            case "$CIRCLE_SHA1" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#CIRCLE_SHA1}" -eq 40
            git init .
            git remote add origin https://github.com/ReMeizu/build-infra.git
            git fetch --depth 1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Bounded CPU memory disk and Geekbench benchmark
          no_output_timeout: 20m
          command: timeout -k 10 1500 bash scripts/ci-benchmark.sh
      - store_artifacts:
          path: evidence
          destination: benchmark-20261010
workflows:
  benchmark-20261010:
    when:
      equal: [codex/cloud-benchmarks-20261010, << pipeline.git.branch >>]
    jobs:
      - cloud-benchmark
