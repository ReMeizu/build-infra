name: Manual kernel and ROM builds
run-name: ${{ inputs.mode == 'component' && 'Kernel component' || 'Blacksmith' }} ${{ inputs.mode }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded task to run
        required: true
        type: choice
        default: probe
        options:
          - probe
          - benchmark
          - kernel
          - rom
          - rom-short
          - component

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'component' && 'kernel-components' || 'blacksmith-monthly-serial' }}
  cancel-in-progress: false

jobs:
  budget:
    if: ${{ github.run_attempt == 1 && inputs.mode != 'component' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      authorized: ${{ steps.reserve.outputs.authorized }}
      runner: ${{ steps.reserve.outputs.runner }}
      timeout_minutes: ${{ steps.reserve.outputs.timeout_minutes }}
      latest_start_utc: ${{ steps.reserve.outputs.latest_start_utc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reserve the full bounded job cost before runner allocation
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_MODE: ${{ inputs.mode }}
        run: python3 -B scripts/budget.py --mode "$REQUEST_MODE"

  runner:
    needs: budget
    if: ${{ github.run_attempt == 1 && needs.budget.outputs.authorized == 'true' }}
    runs-on: ${{ needs.budget.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.budget.outputs.timeout_minutes) }}
    permissions:
      contents: read
    steps:
      - name: Refuse a delayed start outside the reserved window
        id: start_guard
        env:
          LATEST_START_UTC: ${{ needs.budget.outputs.latest_start_utc }}
        run: |
          python3 - <<'PYGUARD'
          import datetime, os
          cutoff = datetime.datetime.fromisoformat(os.environ['LATEST_START_UTC'].replace('Z', '+00:00'))
          now = datetime.datetime.now(datetime.timezone.utc)
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1' or now >= cutoff:
              raise SystemExit('Reservation window expired; new manual dispatch required')
          PYGUARD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: runner_checkout
        with:
          persist-credentials: false
      - name: Measure CPU, memory, disk, tools and public network endpoints
        if: ${{ inputs.mode == 'probe' }}
        run: python3 -B scripts/probe.py
      - name: Install Flexible I/O Tester with bounded package operations
        if: ${{ inputs.mode == 'benchmark' }}
        run: |
          if ! /usr/bin/fio --version 2>/dev/null | /usr/bin/grep -Eq '^fio-[0-9]+([.][0-9]+)+'; then
            sudo -n timeout --signal=TERM --kill-after=5s 90s apt-get update
            sudo -n timeout --signal=TERM --kill-after=5s 90s env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fio
          fi
      - name: Measure bounded CPU, memory and ephemeral disk throughput
        if: ${{ always() && inputs.mode == 'benchmark' && steps.start_guard.outcome == 'success' && steps.runner_checkout.outcome == 'success' }}
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}
        run: |
          mkdir -p evidence
          set +e
          PATH=/usr/bin:/bin:/usr/sbin:/sbin timeout --signal=TERM --kill-after=10s 150s python3 -B scripts/cloud_benchmark.py --root "$BENCHMARK_ROOT" --file-mib 512 --seconds 8 --output evidence/benchmark.json
          benchmark_status=$?
          set -e
          python3 - "$benchmark_status" <<'PYRESULT'
          import json, pathlib, sys
          output = pathlib.Path('evidence/benchmark.json')
          if not output.exists():
              output.write_text(json.dumps({'schema': 1, 'measurement_complete': False, 'process_exit_code': int(sys.argv[1])}) + '\n')
          data = json.loads(output.read_text())
          complete = (int(sys.argv[1]) == 0 and data.get('fio', {}).get('available') is True
                      and all(data.get(k, {}).get('workers_completed', 0) > 0
                              and not data[k].get('errors') for k in ('cpu_single', 'cpu_parallel', 'memory'))
                      and len(data.get('disks', [])) == 1 and data['disks'][0].get('complete') is True
                      and data['disks'][0].get('owned_payload_removed') is True)
          pathlib.Path('evidence/benchmark-status.json').write_text(json.dumps({'measurement_complete': complete, 'process_exit_code': int(sys.argv[1])}) + '\n')
          if not complete:
              raise SystemExit('Incomplete benchmark; compact evidence retained')
          PYRESULT
      - name: Provision a new ephemeral file-backed ext4 scratch volume
        if: ${{ inputs.mode == 'kernel' }}
        run: |
          mkdir -p evidence
          sudo -n python3 -B scripts/provision_scratch.py --runner-temp "$RUNNER_TEMP" --run-id "$GITHUB_RUN_ID" > evidence/scratch.json
      - name: Build the pinned public M5s Yassy object through Forge
        if: ${{ inputs.mode == 'kernel' }}
        run: sudo -n timeout --signal=INT --kill-after=90s 50m python3 -B scripts/kernel_run.py --scratch-mount /mnt/forge --receipt-dir "$RUNNER_TEMP/kernel-receipts"
      - name: Provision ROM scratch on the ephemeral runner disk
        if: ${{ inputs.mode == 'rom' || inputs.mode == 'rom-short' }}
        run: |
          mkdir -p evidence
          sudo -n python3 -B scripts/provision_scratch.py --runner-temp "$RUNNER_TEMP" --run-id "$GITHUB_RUN_ID" --size-gib 600 > evidence/scratch.json
      - name: Read the provider SSH endpoint
        if: ${{ inputs.mode == 'rom' || inputs.mode == 'rom-short' }}
        env:
          ROM_RUNNER_NAME: ${{ runner.name }}
        run: python3 -B scripts/rom_connection.py
      - name: Publish the connection endpoint before the long build step
        if: ${{ inputs.mode == 'rom' || inputs.mode == 'rom-short' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blacksmith-connection-${{ github.run_id }}
          path: connection/ssh.json
          retention-days: 1
          if-no-files-found: error
      - name: Run the bounded ROM worker
        if: ${{ inputs.mode == 'rom' || inputs.mode == 'rom-short' }}
        env:
          ROM_JOB_MINUTES: ${{ needs.budget.outputs.timeout_minutes }}
        run: |
          session_minutes=$((ROM_JOB_MINUTES - 15))
          process_minutes=$((session_minutes + 3))
          sudo -n timeout --signal=INT --kill-after=90s "${process_minutes}m" python3 -B scripts/rom_session.py --session-dir /mnt/forge/rom-session --report evidence/rom-session.json --max-minutes "$session_minutes"
      - name: Make this job's kernel receipts readable for artifact collection
        if: ${{ always() && inputs.mode == 'kernel' }}
        run: |
          if [ -d "$RUNNER_TEMP/kernel-receipts" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/kernel-receipts"
          fi
      - name: Keep the evidence for seven days
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blacksmith-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            evidence/
            ${{ runner.temp }}/kernel-receipts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  component:
    if: ${{ github.run_attempt == 1 && inputs.mode == 'component' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provision new ephemeral kernel scratch
        run: |
          mkdir -p evidence
          sudo -n python3 -B scripts/provision_scratch.py --runner-temp "$RUNNER_TEMP" --run-id "$GITHUB_RUN_ID" --size-gib 24 > evidence/scratch.json
      - name: Compile the pinned complete M5c kernel
        run: sudo -n timeout --signal=INT --kill-after=90s 80m python3 -B scripts/component_run.py --profile m5c-cpu-stats --scratch-mount /mnt/forge --receipt-dir "$RUNNER_TEMP/component-receipts"
      - name: Make this job's receipts readable
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/component-receipts" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/component-receipts"
          fi
      - name: Retain kernel outputs and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-component-m5c-${{ github.run_id }}
          path: |
            evidence/
            ${{ runner.temp }}/component-receipts/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: true
